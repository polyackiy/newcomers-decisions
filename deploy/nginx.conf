# Included inside http context; certbot adds TLS after DNS is verified.
limit_req_zone $binary_remote_addr zone=newcomers_ai:10m rate=2r/m;
server {
    listen 80;
    server_name tz2.pubrick.pro;
    client_max_body_size 257k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /api/analyze {
        limit_req zone=newcomers_ai burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
